user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/json;

    upstream php_backend_dev {
        server app_dev:9000;
    }

    # ===== DEV HTTP (SSL handled by production nginx proxy) =====
    server {
        listen 80;
        server_name dev.it-velora.com;

        root /var/www/frontend/dist;
        index index.html;

        location /api/ {
            root /var/www/backend/public;
            try_files $uri /index.php?$query_string;
            
            location ~ \.php$ {
                fastcgi_pass php_backend_dev;
                fastcgi_index index.php;
                fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
                fastcgi_param HTTPS on;
                include fastcgi_params;
                fastcgi_connect_timeout 60;
                fastcgi_send_timeout 300;
                fastcgi_read_timeout 300;
            }
        }

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location /health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }
}
