user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/json;

    upstream php_backend {
        server app:9000;
    }

    upstream uptime_kuma {
        server calipso_uptime_kuma:3001;
    }

    # ===== NEW DOMAINS HTTP -> HTTPS (with ACME path) =====
    server {
        listen 80;
        server_name velorafinanza.com www.velorafinanza.com monitoring.velorafinanza.com;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/frontend/dist;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ===== VELORA HTTP -> HTTPS =====
    server {
        listen 80;
        server_name it-velora.com www.it-velora.com;
        return 301 https://$host$request_uri;
    }

    # ===== VELORA HTTPS =====
    server {
        listen 443 ssl http2;
        server_name it-velora.com www.it-velora.com;

        ssl_certificate /etc/letsencrypt/live/it-velora.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/it-velora.com/privkey.pem;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        root /var/www/frontend/dist;
        index index.html;

        location = /api/account/messages-test {
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            return 410;
        }

        location /api/ {
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            fastcgi_pass php_backend;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param HTTPS on;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            include fastcgi_params;
            fastcgi_connect_timeout 60;
            fastcgi_send_timeout 300;
            fastcgi_read_timeout 300;
        }

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location /health {
            access_log off;
            return 200 "ok\n";
        }

        location ^~ /storage/ {
            alias /var/www/backend/storage/app/public/;
            try_files $uri =404;
            access_log off;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }


    # ===== NEW MAIN HTTPS =====
    server {
        listen 443 ssl http2;
        server_name velorafinanza.com www.velorafinanza.com;

        ssl_certificate /etc/letsencrypt/live/velorafinanza.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/velorafinanza.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        root /var/www/frontend/dist;
        index index.html;

        location = /api/account/messages-test {
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            return 410;
        }

        location /api/ {
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            fastcgi_pass php_backend;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param HTTPS on;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            include fastcgi_params;
            fastcgi_connect_timeout 60;
            fastcgi_send_timeout 300;
            fastcgi_read_timeout 300;
        }

        location ^~ /storage/ {
            alias /var/www/backend/storage/app/public/;
            try_files $uri =404;
            access_log off;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # ===== NEW ADMIN HTTPS =====
    server {
        listen 443 ssl http2;
        server_name monitoring.velorafinanza.com;

        ssl_certificate /etc/letsencrypt/live/velorafinanza.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/velorafinanza.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        root /var/www/frontend/admin-dist;
        index index.html;
        # hotfix: prevent broken redirect with user=[object Object]
        if ($request_uri ~* "user=%5Bobject%20Object%5D|user=%5Bobject\+Object%5D|user=\[object%20Object\]|user=\[object\+Object\]|user=\[object\sObject\]") {
            return 302 /admin/monitoring;
        }



        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location ^~ /storage/ {
            alias /var/www/backend/storage/app/public/;
            access_log off;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        location /api/ {
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            fastcgi_pass php_backend;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param HTTPS on;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            include fastcgi_params;
            fastcgi_connect_timeout 60;
            fastcgi_send_timeout 300;
            fastcgi_read_timeout 300;
        }
    }

    # ===== ADMIN DOMAIN DISABLED (redirect to monitoring) =====
    server {
        listen 80;
        server_name admin.it-velora.com;
        return 301 https://monitoring.velorafinanza.com$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name admin.it-velora.com;

        ssl_certificate /etc/letsencrypt/live/admin.it-velora.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/admin.it-velora.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        return 301 https://monitoring.velorafinanza.com$request_uri;
    }

# ===== UPTIME KUMA HTTP -> HTTPS =====
    server {
        listen 80;
        server_name omnikredit.com www.omnikredit.com;
        return 301 https://$host$request_uri;
    }

    # ===== UPTIME KUMA HTTPS =====
    server {
        listen 443 ssl http2;
        server_name omnikredit.com www.omnikredit.com;

        ssl_certificate /etc/letsencrypt/live/omnikredit.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/omnikredit.com/privkey.pem;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        location / {
            proxy_pass http://uptime_kuma;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }
    }

    # ===== NEW DEV HTTP -> HTTPS =====
    server {
        listen 80;
        server_name dev.velorafinanza.com;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/frontend/dist;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ===== NEW DEV HTTPS (proxy to dev nginx) =====
    server {
        listen 443 ssl http2;
        server_name dev.velorafinanza.com;

        ssl_certificate /etc/letsencrypt/live/dev.velorafinanza.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dev.velorafinanza.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

        location / {
            proxy_pass http://172.17.0.1:8090;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }
    }

    # ===== DEV HTTP -> HTTPS =====
    server {
        listen 80;
        server_name dev.it-velora.com;
        return 301 https://$host$request_uri;
    }

    # ===== DEV HTTPS (proxy to dev nginx) =====
    server {
        listen 443 ssl http2;
        server_name dev.it-velora.com;

        ssl_certificate /etc/letsencrypt/live/it-velora.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/it-velora.com/privkey.pem;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

        location / {
            proxy_pass http://172.17.0.1:8090;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }
    }
}
