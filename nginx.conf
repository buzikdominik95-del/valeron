user www-data;
worker_processes auto;
pid /run/nginx.pid;

worker_rlimit_nofile 65535;
events { worker_connections 8192; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    access_log /var/log/nginx/access.log;
    access_log /var/log/nginx-host/access.log;
    error_log /var/log/nginx/error.log;
    error_log /var/log/nginx-host/error.log;

    # --- Cloudflare real IP (чтобы видеть настоящие IP клиентов) ---
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    # --- Rate limiting ---
    limit_req_zone $binary_remote_addr zone=site_limit:20m rate=10r/s;
    limit_req_status 429;



    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/json application/xml image/svg+xml font/ttf font/otf application/wasm;

    upstream php_backend {
        server calipso_app:9000;
    }

    ssl_certificate /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    server {
        limit_req zone=site_limit burst=30 nodelay;
        listen 80;
        listen 443 ssl;
        server_name velorafinanza.com www.velorafinanza.com dev.velorafinanza.com;

        root /var/www/frontend/dist;
        index index.html;

        location ^~ /reverb/ {
            proxy_pass http://calipso_reverb:8080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade "websocket";
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
            proxy_send_timeout 300;
        }

        location = /api/meta/events {
            limit_req zone=site_limit burst=5 nodelay;
            fastcgi_pass php_backend;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param HTTPS $https if_not_empty;
            include fastcgi_params;
            fastcgi_connect_timeout 60;
            fastcgi_send_timeout 300;
            fastcgi_read_timeout 300;
        }

        location /api/ {
            fastcgi_pass php_backend;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param HTTPS $https if_not_empty;
            include fastcgi_params;
            fastcgi_connect_timeout 60;
            fastcgi_send_timeout 300;
            fastcgi_read_timeout 300;
        }

        location ^~ /storage/ {
            alias /var/www/backend/storage/app/public/;
            try_files $uri =404;
            access_log off;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        location ^~ /assets/ {
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~ /\.
        {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    server {
        limit_req zone=site_limit burst=30 nodelay;
        listen 80;
        listen 443 ssl;
        server_name monitoring.velorafinanza.com;

        root /var/www/frontend/admin-dist;
        index index.html;

        location ^~ /reverb/ {
            proxy_pass http://calipso_reverb:8080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade "websocket";
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
            proxy_send_timeout 300;
        }

        location /api/ {
            fastcgi_pass php_backend;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param HTTPS $https if_not_empty;
            include fastcgi_params;
            fastcgi_connect_timeout 60;
            fastcgi_send_timeout 300;
            fastcgi_read_timeout 300;
        }

        location ^~ /storage/ {
            alias /var/www/backend/storage/app/public/;
            try_files $uri =404;
            access_log off;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        location ^~ /assets/ {
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~ /\.
        {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    server {
        listen 80;
        server_name localhost 127.0.0.1;

        root /var/www/frontend/dist;
        index index.html;

        location /api/ {
            fastcgi_pass php_backend;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            include fastcgi_params;
            fastcgi_connect_timeout 60;
            fastcgi_send_timeout 300;
            fastcgi_read_timeout 300;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;
        return 444;
    }
}
