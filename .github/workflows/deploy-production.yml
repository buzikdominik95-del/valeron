name: Deploy to Production Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          script: |
            cd /var/www/calipso-v2
            git pull origin main
            
            # Backend
            cd backend
            docker exec calipso_app composer install --no-dev --optimize-autoloader
            docker exec calipso_app php artisan migrate --force
            docker exec calipso_app php artisan config:cache
            docker exec calipso_app php artisan route:cache
            docker exec calipso_app php artisan view:cache
            
            # Frontend
            cd ../frontend
            npm ci
            npm run build
            
            # Restart services
            cd ..
            docker-compose restart app queue reverb nginx
            
            echo "🚀 Production deployed successfully!"
