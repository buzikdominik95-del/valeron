name: Deploy to Dev Server (Develop Branch)

on:
  push:
    branches:
      - develop
  workflow_run:
    workflows:
      - Sync main to develop
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deploy-develop
  cancel-in-progress: false

jobs:
  deploy-dev:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Deploy to dev (helonovya.com)
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Dev Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          script: |
            /root/auto-deploy.sh
            tail -3 /root/auto-deploy.log
            git -C /home/usergpu/valerprod rev-parse --short HEAD
            echo "✅ Dev deployment complete! Check https://helonovya.com"
