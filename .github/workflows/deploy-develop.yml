name: Deploy to Development Server

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Deploy to Dev Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Development Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          script: |
            cd /var/www/calipso-v2-dev
            git pull origin develop
            
            # Backend
            cd backend
            docker exec calipso_app_dev composer install --no-dev --optimize-autoloader
            docker exec calipso_app_dev php artisan migrate --force
            docker exec calipso_app_dev php artisan config:clear
            docker exec calipso_app_dev php artisan cache:clear
            docker exec calipso_app_dev php artisan view:clear
            
            # Frontend
            cd ../frontend
            npm ci
            npm run build
            
            # Restart services
            cd ..
            docker-compose restart app queue reverb nginx
            
            echo "✅ Development deployed successfully!"
