name: Deploy to Dev Server (Develop Branch)

on:
  push:
    branches:
      - develop
  workflow_run:
    workflows:
      - Sync main to develop
    types:
      - completed

jobs:
  deploy-dev:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    name: Deploy to dev.it-velora.com
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to Dev Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          script: |
            cd /var/www/calipso-v2-dev
            
            # Pull latest code from develop branch
            git pull origin develop
            
            # Install backend dependencies
            docker exec -u root calipso_app_dev composer install --no-dev --optimize-autoloader
            
            # Run migrations
            docker exec calipso_app_dev php artisan migrate --force
            
            # Clear and cache config
            docker exec calipso_app_dev php artisan config:cache
            docker exec calipso_app_dev php artisan route:cache
            docker exec calipso_app_dev php artisan view:cache
            
            # Build frontend
            cd frontend
            npm install --legacy-peer-deps
            npm run build
            
            # Restart services
            cd ..
            docker-compose -f docker-compose-dev.yml restart app_dev queue_dev reverb_dev
            
            echo "✅ Dev deployment complete! Check https://dev.it-velora.com"
