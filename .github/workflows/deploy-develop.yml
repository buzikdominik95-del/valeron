# Dev-сервер (helonovya.com) обновляется PULL-моделью: cron на dev-хосте
# каждые 2 минуты запускает /root/auto-deploy.sh (fetch+ff-merge origin/develop,
# composer install, рестарт контейнеров). Push-модель через GitHub Actions
# не работает: хостинг dev-сервера сбрасывает SSH-соединения с раннеров GitHub.
# Этот workflow оставлен только для ручного запуска на случай отладки.
name: Deploy to Dev Server (manual only)

on:
  workflow_dispatch:

jobs:
  deploy-dev:
    name: Deploy to dev (helonovya.com)
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Dev Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          script: |
            /root/auto-deploy.sh
            tail -3 /root/auto-deploy.log
            git -C /home/usergpu/valerprod rev-parse --short HEAD
