    <script>
      (function () {
        function isBad(urlLike) {
          try {
            if (!urlLike) {
              urlLike = window.location.href;
            }
            var u = new URL(urlLike, window.location.origin);
            if (u.pathname !== '/admin/chats') {
              return false;
            }
            var raw = u.searchParams.get('user');
            if (!raw) {
              return false;
            }
            var dec = raw;
            try {
              dec = decodeURIComponent(raw);
            } catch (_) {}
            var badRaw = /\[object\s+Object\]/i.test(raw);
            var badDec = /\[object\s+Object\]/i.test(dec);
            if (badRaw) {
              return true;
            }
            if (badDec) {
              return true;
            }
            return false;
          } catch (_) {
            return false;
          }
        }

        function monitoringUrl(from) {
          if (!from) {
            from = window.location.href;
          }
          var u = new URL(from, window.location.origin);
          u.pathname = '/admin/monitoring';
          u.search = '';
          u.hash = '';
          return u.toString();
        }

        if (isBad(window.location.href)) {
          window.location.replace(monitoringUrl(window.location.href));
          return;
        }

        function wrap(method) {
          var original = history[method];
          history[method] = function (state, title, url) {
            if (typeof url === 'string') {
              if (isBad(url)) {
                url = monitoringUrl(url);
              }
            }
            return original.call(this, state, title, url);
          };
        }

        wrap('pushState');
        wrap('replaceState');
      })();
    </script>
